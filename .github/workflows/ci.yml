name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the pipeline only needs to read the repository
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v7
        with:
          # Same major as the Dockerfiles (node:20-alpine)
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx turbo build

      # Blocking: vulnerabilities that ship to production fail the pipeline
      - name: Security audit (production)
        run: npm audit --omit=dev --audit-level=high

      # Informational: dev-only tooling does not reach production
      - name: Security audit (full)
        run: npm audit --audit-level=high
        continue-on-error: true
