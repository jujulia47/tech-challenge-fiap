services:
  json-server:
    # json-server comes installed in the image, so starting needs no network
    build:
      context: .
      dockerfile: apps/shell/Dockerfile.jsonserver
    # A folder, never the file: json-server saves with a rename, which fails on a mounted file.
    # Only this folder: all of apps/shell would expose .env.local and the public folder.
    volumes:
      - ./apps/shell/data:/app
    # No published port: only the apps reach it, through the bytebank network. See docs/fase4/infrastructure.md
    networks:
      - bytebank

  mailpit:
    image: axllent/mailpit:v1.29.5
    # SMTP only inside the bytebank network. The inbox only on this machine: http://localhost:8025
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - bytebank

  # Refuses a missing, example or short secret before any app starts. Plain Node runs the rule of
  # packages/utils/src/secrets.ts, the same one the apps run when they start: docs/fase4/security.md
  secrets-check:
    image: node:22-alpine
    command: ["node", "/check/scripts/check-secrets.mts", "NEXTAUTH_SECRET", "ATTACHMENT_ENCRYPTION_KEY"]
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - ATTACHMENT_ENCRYPTION_KEY=${ATTACHMENT_ENCRYPTION_KEY:-}
    volumes:
      - ./packages/utils/src/secrets.ts:/check/src/secrets.ts:ro
      - ./packages/utils/scripts/check-secrets.mts:/check/scripts/check-secrets.mts:ro
    network_mode: none

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      # The public address of the shell, for the link of the reset email
      - SHELL_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Missing or invalid NEXTAUTH_SECRET. Generate 32 random bytes in base64, as in step 3 of the README}
      # json-server by default; supabase uses the project of .env: docs/fase4/deploy.md
      - JSON_SERVER_URL=http://json-server:3001
      - DATA_BACKEND=${DATA_BACKEND:-json-server}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=Bytebank <no-reply@bytebank.local>
      # Only for a demonstration, and they can only shorten: see docs/fase4/security.md
      - SESSION_MAX_AGE_SECONDS=${SESSION_MAX_AGE_SECONDS:-}
      - IDLE_TIMEOUT_SECONDS=${IDLE_TIMEOUT_SECONDS:-}
      - IDLE_WARNING_SECONDS=${IDLE_WARNING_SECONDS:-}
    depends_on:
      secrets-check:
        condition: service_completed_successfully
      json-server:
        condition: service_started
      mailpit:
        condition: service_started
      dashboard:
        condition: service_started
      transactions:
        condition: service_started
    networks:
      - bytebank

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NEXTAUTH_URL=http://localhost:3003
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Missing or invalid NEXTAUTH_SECRET. Generate 32 random bytes in base64, as in step 3 of the README}
      # json-server by default; supabase uses the project of .env: docs/fase4/deploy.md
      - JSON_SERVER_URL=http://json-server:3001
      - DATA_BACKEND=${DATA_BACKEND:-json-server}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000
      - SHELL_URL=http://localhost:3000
      - ATTACHMENT_ENCRYPTION_KEY=${ATTACHMENT_ENCRYPTION_KEY:?Missing or invalid ATTACHMENT_ENCRYPTION_KEY. Generate 32 random bytes in base64, as in step 3 of the README}
      - SESSION_MAX_AGE_SECONDS=${SESSION_MAX_AGE_SECONDS:-}
    depends_on:
      secrets-check:
        condition: service_completed_successfully
      json-server:
        condition: service_started
    networks:
      - bytebank

  transactions:
    build:
      context: .
      dockerfile: apps/transactions/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Missing or invalid NEXTAUTH_SECRET. Generate 32 random bytes in base64, as in step 3 of the README}
      # json-server by default; supabase uses the project of .env: docs/fase4/deploy.md
      - JSON_SERVER_URL=http://json-server:3001
      - DATA_BACKEND=${DATA_BACKEND:-json-server}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000
      - SHELL_URL=http://localhost:3000
      - ATTACHMENT_ENCRYPTION_KEY=${ATTACHMENT_ENCRYPTION_KEY:?Missing or invalid ATTACHMENT_ENCRYPTION_KEY. Generate 32 random bytes in base64, as in step 3 of the README}
      - SESSION_MAX_AGE_SECONDS=${SESSION_MAX_AGE_SECONDS:-}
    depends_on:
      secrets-check:
        condition: service_completed_successfully
      json-server:
        condition: service_started
    networks:
      - bytebank

networks:
  bytebank:
    driver: bridge
